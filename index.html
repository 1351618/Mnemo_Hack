<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="./index.css" />
    <link rel="manifest" href="manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <header class="header"></header>
    <main class="main">
      <!-- МЕНЮ -->
      <div id="block-menu">
        <!-- Статистика -->
        <div id="menu-stats"></div>

        <!-- Кнопки -->
        <div id="menu-buttons">
          <button id="btn-order">Порядок</button>
          <button id="btn-start">Учить</button>
          <button id="btn-words">Слова</button>
        </div>
        <button id="btn-settings">⚙️</button>
      </div>
      <!-- ПОРЯДОК -->
      <div id="block-order">block-order</div>

      <!-- УЧИТЬ -->
      <div id="block-learn">
        <div id="card">
          <div id="card-ru">РУ</div>
          <div id="card-en">АНГ</div>
          <div id="card-gr">ГРЕЧ</div>
          <div id="card-comment">КОММЕНТ</div>
          <div id="card-number">НОМЕР</div>
          <div id="card-code">КОД-ЦБК</div>
        </div>
      </div>

      <!-- СЛОВА -->
      <div id="block-words">block-words</div>
      <!-- НАСТРОЙКИ -->
      <div id="block-settings">
        <input
          id="input-url"
          type="text"
          placeholder="Вставь ссылку на Google таблицу"
        />
        <button id="btn-save-url">Сохранить</button>
      </div>
    </main>
    <footer class="footer"></footer>
    <script src="./index.js" type="module"></script>
  </body>
</html>
